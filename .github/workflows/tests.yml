name: tests
on: [push, pull_request, workflow_dispatch]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pytest
      - run: pytest -q tests
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check custom_components/ev_charge_director/www/ev-charge-director-card.js
